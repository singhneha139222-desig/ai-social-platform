version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ai-social-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: ai-social-ai
    ports:
      - "5001:5001"
    environment:
      - AI_PORT=5001
      - DEVICE=cpu
      - MODEL_CACHE_DIR=/app/models_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-social-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/ai-social-platform
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - JWT_EXPIRES_IN=7d
      - AI_SERVICE_URL=http://ai-service:5001
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - CLOUDINARY_CLOUD_NAME=dj74x9ppq
      - CLOUDINARY_API_KEY=726374836959711
      - CLOUDINARY_API_SECRET=0_CBbFIq_rntzT8DtOk5i9wMk18
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_EMAIL=${SMTP_EMAIL:-your_email@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-your_app_password}
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 15s
      timeout: 5s
      retries: 3



volumes:
  mongo-data:
